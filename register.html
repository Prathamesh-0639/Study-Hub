<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Study Materials</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card mx-auto shadow p-4" style="max-width: 400px;">
    <h3 class="text-center mb-3">Create Account</h3>
    <form method="POST" action="/register">
      <input type="text" class="form-control mb-3" name="name" placeholder="Full Name" required>
      <input type="email" class="form-control mb-3" name="email" placeholder="Email" required>
      <input type="password" class="form-control mb-3" name="password" placeholder="Password" required>
      <button class="btn btn-primary w-100">Register</button>
      <p class="text-center mt-3">Already have an account? <a href="/index">Login</a></p>
    </form>
  </div>
</div>

</body>
</html>
